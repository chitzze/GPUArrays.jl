name: Test

on:
  push:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13-nightly', 'nightly']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        timeout-minutes: 10
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        timeout-minutes: 5
      - name: Develop subpackages
        timeout-minutes: 5
        run: "echo skipped-for-baseline-isolation"
      - name: "Set test arguments"
        shell: bash
        run: "echo skipped-for-baseline-isolation"
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          test_args: ${{ env.runtest_test_args }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,lib
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
  opencl:
    name: OpenCL.jl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: |
          julia -e 'using Pkg

                    gpuarrays = pwd()
                    gpuarrayscore = joinpath(gpuarrays, "lib", "GPUArraysCore")
                    devdir = mktempdir()
                    package = joinpath(devdir, "OpenCL")

                    println("--- :julia: Installing TestEnv")
                    Pkg.activate(; temp=true)
                    Pkg.add("TestEnv")
                    using TestEnv

                    println("--- :julia: Installing OpenCL.jl")
                    withenv("JULIA_PKG_PRECOMPILE_AUTO" => 0,
                            "JULIA_PKG_DEVDIR" => devdir) do
                      Pkg.develop("OpenCL")
                      Pkg.activate(package)

                      try
                        Pkg.develop([PackageSpec(path=gpuarrays), PackageSpec(path=gpuarrayscore)])
                        TestEnv.activate()
                      catch err
                        @error "Could not install OpenCL.jl" exception=(err,catch_backtrace())
                        exit(0)
                      finally
                        Pkg.activate(package)
                      end
                    end

                    println("+++ :julia: Running tests")
                    Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,lib
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Develop packages
        run: "echo skipped-for-baseline-isolation"
      - name: Install dependencies
        run: "echo skipped-for-baseline-isolation"
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: "echo skipped-for-baseline-isolation"
